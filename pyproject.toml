[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "funnelbot"
version = "1.0.0"
description = "Self-hosted Telegram sales-funnel bot with payments (Telegram Stars, cards, YooKassa, Crypto Pay): one YAML file, paid access to a private channel, digital products, manager requests, a button-based admin panel. Russian and English."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["telegram", "telegram-bot", "sales-funnel", "payments", "telegram-stars", "yookassa", "crypto-pay", "paid-channel", "subscription", "aiogram", "self-hosted", "yaml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = ["aiogram>=3.27,<4", "PyYAML>=6", "aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
funnelbot = "funnelbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
funnelbot = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP006", "UP007", "UP031", "UP035", "UP045", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
