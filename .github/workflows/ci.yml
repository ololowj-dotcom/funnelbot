name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Smoke-test the installed command
        run: |
          funnelbot --version
          funnelbot init /tmp/shop --token 1:x --admin 5 --manager -100777
          funnelbot validate -f /tmp/shop/funnel.yaml
          printf '3\n1\n1\n1\n:pay\n:quit\n' | funnelbot preview -f /tmp/shop/funnel.yaml

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck install.sh
      - name: Installer end to end (from this checkout)
        run: |
          sudo FUNNELBOT_NO_SETUP=1 FUNNELBOT_REPO="file://$GITHUB_WORKSPACE" FUNNELBOT_REF="$GITHUB_SHA" bash install.sh
          funnelbot --version

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and run the built-in commands
        run: |
          docker build -t funnelbot .
          docker run --rm funnelbot --version
          mkdir -p bot
          docker run --rm -v "$PWD/bot:/data" funnelbot init /data --token 1:x --admin 5
          docker run --rm -v "$PWD/bot:/data" funnelbot validate -f /data/funnel.yaml
